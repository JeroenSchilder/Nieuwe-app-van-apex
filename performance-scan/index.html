    window.apexLeadSource = (function () {
        var KEY = 'apexBron';
        var CODES = ["a1","a2","a3","a4","a5","a6","a7","a8"];
        var REFERRERS = [
            [/(^|\.)instagram\.com$/, 'a1'],
            [/(^|\.)(facebook\.com|fb\.com|fb\.me)$/, 'a2'],
            [/(^|\.)(linkedin\.com|lnkd\.in)$/, 'a3'],
            [/(^|\.)google\.[a-z.]+$/, 'a4']
        ];
        try {
            var match = location.search.match(/[?&]r=([a-z0-9]+)/i);
            var code = match && CODES.indexOf(match[1].toLowerCase()) !== -1 ? match[1].toLowerCase() : null;
            if (!code && document.referrer) {
                var host = new URL(document.referrer).hostname;
                REFERRERS.forEach(function (r) { if (!code && r[0].test(host)) code = r[1]; });
            }
            if (code) localStorage.setItem(KEY, JSON.stringify({ code: code, at: Date.now() }));
        } catch (e) {}

        return function () {
            try {
                var stored = JSON.parse(localStorage.getItem(KEY) || 'null');
                if (stored && Date.now() - stored.at < 30 * 24 * 60 * 60 * 1000) return stored.code;
            } catch (e) {}
            return null;
        };
    })();

<script id="browser-logger-active">
(function() {
    const ENDPOINT = '/_boost/browser-logs';
    const logQueue = [];
    let flushTimeout = null;
    const captureTypes = ["error","warning","info","log","debug","table"];

    console.log('🔍 Browser logger active (MCP server detected). Posting to: ' + ENDPOINT);

    // Store original console methods
    const originalConsole = {
        log: console.log,
        debug: console.debug,
        info: console.info,
        error: console.error,
        warn: console.warn,
        table: console.table
    };

    // Walk own enumerable keys so JSON.stringify cannot auto-invoke a proxy fake toJSON (e.g. Livewire's `$wire`) and fire a real request.
    function toSafeValue(value, seen) {
        if (value === null || typeof value !== 'object') {
            return value;
        }
        if (value instanceof Error) {
            return { name: value.name, message: value.message, stack: value.stack };
        }
        // Date has no own enumerable keys, so the walk below would collapse it to {}.
        if (value instanceof Date) {
            return value.toISOString();
        }
        if (seen.has(value)) {
            return '[Circular]';
        }
        seen.add(value);
        if (Array.isArray(value)) {
            return value.map((item) => toSafeValue(item, seen));
        }
        const plain = {};
        for (const key of Object.keys(value)) {
            if (key === 'toJSON') continue;
            try {
                plain[key] = toSafeValue(value[key], seen);
            } catch (e) {
                plain[key] = '[Unreadable]';
            }
        }
        return plain;
    }

    // Helper to safely stringify values
    function safeStringify(obj) {
        return JSON.stringify(toSafeValue(obj, new WeakSet()));
    }

    // Normalize log type for consistency (e.g., 'warn' to 'warning')
    function normalizeType(type) {
        return type === 'warn' ? 'warning' : type;
    }

    // Determine if a log type should be captured based on configured levels
    function shouldCapture(type) {
        return captureTypes.includes(normalizeType(type));
    }

    // Batch and send logs
    function flushLogs() {
        if (logQueue.length === 0) return;

        const batch = logQueue.splice(0, logQueue.length);

        fetch(ENDPOINT, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: JSON.stringify({ logs: batch })
        }).catch(err => {
            // Silently fail to avoid infinite loops
            originalConsole.error('Failed to send logs:', err);
        });
    }

    // Debounced flush (100ms)
    function scheduleFlush() {
        if (flushTimeout) clearTimeout(flushTimeout);
        flushTimeout = setTimeout(flushLogs, 100);
    }

    // Intercept console methods
    ['log', 'debug', 'info', 'error', 'warn', 'table'].forEach(method => {
        console[method] = function(...args) {
            // Call original method
            originalConsole[method].apply(console, args);

            // Capture log data
            try {
                if (!shouldCapture(method)) {
                    return;
                }

                logQueue.push({
                    type: method,
                    timestamp: new Date().toISOString(),
                    data: args.map(arg => {
                        try {
                            return typeof arg === 'object' ? JSON.parse(safeStringify(arg)) : arg;
                        } catch (e) {
                            return String(arg);
                        }
                    }),
                    url: window.location.href,
                    userAgent: navigator.userAgent
                });

                scheduleFlush();
            } catch (e) {
                // Fail silently
            }
        };
    });

    // Global error handlers for uncaught errors
    const originalOnError = window.onerror;
    window.onerror = function boostErrorHandler(errorMsg, url, lineNumber, colNumber, error) {
        try {
            if (shouldCapture('error')) {
                logQueue.push({
                    type: 'uncaught_error',
                    timestamp: new Date().toISOString(),
                    data: [{
                        message: errorMsg,
                        filename: url,
                        lineno: lineNumber,
                        colno: colNumber,
                        error: error ? {
                            name: error.name,
                            message: error.message,
                            stack: error.stack
                        } : null
                    }],
                    url: window.location.href,
                    userAgent: navigator.userAgent
                });

                scheduleFlush();
            }

        } catch (e) {
            // Fail silently
        }

        // Call original handler if it exists
        if (originalOnError && typeof originalOnError === 'function') {
            return originalOnError(errorMsg, url, lineNumber, colNumber, error);
        }

        // Let the error continue to propagate
        return false;
    }
    window.addEventListener('error', (event) => {
        try {
            if (!shouldCapture('error')) {
                return false;
            }

            logQueue.push({
                type: 'window_error',
                timestamp: new Date().toISOString(),
                data: [{
                    message: event.message,
                    filename: event.filename,
                    lineno: event.lineno,
                    colno: event.colno,
                    error: event.error ? {
                        name: event.error.name,
                        message: event.error.message,
                        stack: event.error.stack
                    } : null
                }],
                url: window.location.href,
                userAgent: navigator.userAgent
            });

            scheduleFlush();
        } catch (e) {
            // Fail silently
        }

        // Let the error continue to propagate
        return false;
    });
    window.addEventListener('unhandledrejection', (event) => {
        try {
            if (!shouldCapture('error')) {
                return false;
            }

            logQueue.push({
                type: 'error',
                timestamp: new Date().toISOString(),
                data: [{
                    message: 'Unhandled Promise Rejection',
                    reason: toSafeValue(event.reason, new WeakSet())
                }],
                url: window.location.href,
                userAgent: navigator.userAgent
            });

            scheduleFlush();
        } catch (e) {
            // Fail silently
        }

        // Let the rejection continue to propagate
        return false;
    });

    // Flush on page unload
    window.addEventListener('beforeunload', () => {
        if (logQueue.length > 0) {
            navigator.sendBeacon(ENDPOINT, JSON.stringify({ logs: logQueue }));
        }
    });
})();
</script>

        { id: 'l_doel', kind: 'ladder', block: 'leven', topic: 'Doelen', domain: 'leven', lever: 'leiderschap', shuffle: true,

        { id: 'jachtA', kind: 'styleGroup', style: 'jacht', block: 'apex', topic: 'Jachtstijl' },
        { id: 'jachtB', kind: 'styleAnimal', style: 'jacht', block: 'apex', topic: 'Jachtstijl' },
        { id: 'leidA', kind: 'styleGroup', style: 'leid', block: 'apex', topic: 'Leiderschapsstijl' },
        { id: 'leidB', kind: 'styleAnimal', style: 'leid', block: 'apex', topic: 'Leiderschapsstijl' },

        { id: 'omzet', kind: 'choice', block: 'slot', topic: 'Omzet', ondernemer: true,
            title: 'Wat is de maandelijkse omzet van je bedrijf?', sub: 'We vragen dit alleen om je rapport relevant te maken. We delen of verkopen geen data.',
            options: REVENUE_OPTIONS.map(function (o) { return o.label; }) },
        { id: 'verandering', kind: 'choice', block: 'slot', title: 'Als je één ding zou mogen veranderen, wat zou dat zijn?',
            options: ['Rust in mijn hoofd, ook na werktijd', 'Mijn bedrijf laten groeien zonder mezelf op te branden', 'Eindelijk uitvoeren wat ik al weet', 'Fitter en energieker worden', 'Meer aandacht voor de mensen thuis', 'Sneller en zekerder beslissingen nemen', 'Mijn team laten draaien zonder dat ik overal bovenop zit'] },
        { id: 'hoe_lang', kind: 'choice', block: 'slot', title: 'Hoe lang herken je deze patronen al?',
            options: ['Pas recent', '6–12 maanden', '1–2 jaar', 'Zo lang ik me kan herinneren'] },
        { id: 'urgentie', kind: 'rating', block: 'slot', title: 'Hoe belangrijk is het voor je dat hier de komende drie maanden iets verandert?', low: 'niet belangrijk', high: 'heel belangrijk' }
    ];
    var Q = {};
    QUESTIONS.forEach(function (q) { Q[q.id] = q; });

    function buildSteps() {
        var steps = [];
        if (!CONTACT) steps.push({ kind: 'capture' });
        var lastBlock = null;
        QUESTIONS.forEach(function (q) {
            if (lastBlock === 'werk' && q.block === 'prive') steps.push({ kind: 'interstitial', key: 'social' });
            if (lastBlock === 'leven' && q.block === 'apex') steps.push({ kind: 'interstitial', key: 'wist' });
            steps.push(q);
            lastBlock = q.block;
        });
        steps.push({ kind: 'results' });
        return steps;
    }
    var STEPS = buildSteps();

    var state = { stepIndex: 0, answers: {}, order: {}, submitted: false };

    // ============================================================
    // FLOW
    // ============================================================
    function isOndernemer() { var i = state.answers.situatie; return i == null || SITUATIONS[i].ondernemer; }
    function isShown(step) { return !step.ondernemer || isOndernemer(); }
    function isQuestion(step) { return step.kind !== 'capture' && step.kind !== 'interstitial' && step.kind !== 'results'; }
    function totalQuestions() {
        var n = 0;
        STEPS.forEach(function (s) { if (isQuestion(s) && isShown(s)) n++; });
        return n;
    }
    // Questions up to and including the step at idx.
    function questionNumber(idx) {
        var n = 0;
        for (var i = 0; i <= idx; i++) { if (isQuestion(STEPS[i]) && isShown(STEPS[i])) n++; }
        return n;
    }
    function nextIndex(from) {
        for (var i = from + 1; i < STEPS.length; i++) { if (isShown(STEPS[i])) return i; }
        return STEPS.length - 1;
    }
    function prevIndex(from) {
        for (var i = from - 1; i >= 0; i--) { if (isShown(STEPS[i])) return i; }
        return -1;
    }
    function firstOfBlock(idx) {
        for (var i = idx - 1; i >= 0; i--) {
            if (isQuestion(STEPS[i]) && isShown(STEPS[i])) return STEPS[i].block !== STEPS[idx].block;
        }
        return true;
    }
    function goNext() { state.stepIndex = nextIndex(state.stepIndex); render(); }
    // The contact step is never revisited: going back to it would create a second lead.
    function canGoBack() { var p = prevIndex(state.stepIndex); return p >= 0 && STEPS[p].kind !== 'capture'; }
    function goBack() { if (canGoBack()) { state.stepIndex = prevIndex(state.stepIndex); render(); } }

    // Answer options keep the same (shuffled) order when someone comes back to a question.
    function orderFor(key, n, shuffle) {
        if (!state.order[key]) {
            var idx = [];
            for (var i = 0; i < n; i++) idx.push(i);
            if (shuffle) {
                for (var j = idx.length - 1; j > 0; j--) {
                    var k = Math.floor(Math.random() * (j + 1));
                    var t = idx[j]; idx[j] = idx[k]; idx[k] = t;
                }
            }
            state.order[key] = idx;
        }
        return state.order[key];
    }

    function contextFor(step) {
        var block = BLOCKS[step.block];
        if (!block) return '';
        return step.topic ? block.label + ' · ' + step.topic : block.label;
    }
    function titleFor(q) {
        if (q.kind === 'styleGroup') return STYLE[q.style].question;
        if (q.kind === 'styleAnimal') return 'Welke past het best bij jou?';
        if (!isOndernemer() && q.titleLoondienst) return q.titleLoondienst;
        return q.title || q.text;
    }
    function animalOptions(style) {
        var group = state.answers[style === 'jacht' ? 'jachtA' : 'leidA'] || 1;
        return STYLE[style].animals.filter(function (a) { return ANIMALS[a.animal].group === group; });
    }

    // ============================================================
    // SCORING
    // ============================================================
    function gradeOf(q) {
        var v = state.answers[q.id];
        if (v == null || !q.lever) return null;
        if (q.kind === 'statement') { var x = q.reverse ? 6 - v : v; return 1 + (x - 1) * 9 / 4; }
        if (q.kind === 'ladder') return 1 + v * 9 / (q.options.length - 1);
        if (q.kind === 'rating') return v;
        return null;
    }
    function avg(list) {
        var vals = list.filter(function (v) { return v != null; });
        return vals.length ? vals.reduce(function (a, b) { return a + b; }, 0) / vals.length : null;
    }
    function scoredQuestions() {
        return QUESTIONS.filter(function (q) { return q.lever && isShown(q) && state.answers[q.id] != null; });
    }
    // Levels and colours follow the grade as shown (one decimal), so a 5,5 is never orange.
    function levelFor(grade) {
        var g = round1(grade);
        for (var i = 0; i < LEVELS.length; i++) { if (g >= LEVELS[i].min) return LEVELS[i]; }
        return LEVELS[LEVELS.length - 1];
    }
    function colorFor(grade) { var g = round1(grade); return g >= 8.5 ? 'var(--lvl-green)' : g >= 5.5 ? 'var(--lvl-gold)' : 'var(--lvl-orange)'; }
    function fmt(grade) { return grade == null ? '-' : (Math.round(grade * 10) / 10).toFixed(1).replace('.', ','); }
    function round1(grade) { return grade == null ? null : Math.round(grade * 10) / 10; }
    function computeCost(total, revenue) {
        if (!revenue || total == null) return null;
        var base = revenue.mid * revenue.pct;
        // Same thresholds as the earlier scores of 40 and 65 out of 100.
        if (total < 3.25) base *= 1.2;
        else if (total > 6.05) base *= 0.85;
        var monthly = Math.round(base / 50) * 50;
        return { monthly: monthly, yearly: monthly * 12 };
    }

    function computeResults() {
        var qs = scoredQuestions();
        function gradesWhere(test) { return qs.filter(test).map(gradeOf); }
        var levers = {}, domains = {};
        LEVER_ORDER.forEach(function (L) { levers[L] = avg(gradesWhere(function (q) { return q.lever === L; })); });
        // Questions about your whole life count in every domain.
        DOMAIN_ORDER.forEach(function (D) { domains[D] = avg(gradesWhere(function (q) { return q.domain === D || q.domain === 'leven'; })); });
        var total = avg(DOMAIN_ORDER.map(function (D) { return domains[D]; }));

        function lowestAnswer(L) { return Math.min.apply(null, gradesWhere(function (q) { return q.lever === L; })); }
        var ranked = LEVER_ORDER.filter(function (L) { return levers[L] != null; }).sort(function (a, b) {
            return (levers[a] - levers[b]) || (lowestAnswer(a) - lowestAnswer(b)) || (LEVER_ORDER.indexOf(a) - LEVER_ORDER.indexOf(b));
        });
        var lek = ranked[0], tweede = ranked[1];

        // Where the biggest leak shows most: the domain with the lowest grade on that lever.
        var lekDomain = null, lekDomainGrade = null;
        DOMAIN_ORDER.forEach(function (D) {
            var g = avg(gradesWhere(function (q) { return q.lever === lek && q.domain === D; }));
            if (g != null && (lekDomainGrade == null || g < lekDomainGrade)) { lekDomain = D; lekDomainGrade = g; }
        });

        var jacht = state.answers.jachtB || 'wolf';
        var leid = state.answers.leidB || jacht;
        function sentenceFor(L) {
            var animal = ANIMALS[L === 'leiderschap' ? leid : jacht];
            return { animal: animal, text: animal.lek[L] };
        }
        var revenue = isOndernemer() && state.answers.omzet != null ? REVENUE_OPTIONS[state.answers.omzet] : null;

        return {
            total: total, domains: domains, levers: levers,
            lek: lek, lekLevel: levelFor(levers[lek]), lekDomain: lekDomain, lekSentence: sentenceFor(lek),
            tweede: tweede, tweedeLevel: tweede ? levelFor(levers[tweede]) : null, tweedeSentence: tweede ? sentenceFor(tweede) : null,
            jachtKey: jacht, leidKey: leid, jacht: ANIMALS[jacht], leid: ANIMALS[leid], pure: jacht === leid,
            action: ACTIONS[lekDomain + '.' + lek] || ACTIONS[FALLBACK_ACTION[lek]],
            revenue: revenue, cost: computeCost(total, revenue)
        };
    }

    function profileLabel(r, withEmoji) {
        var j = (withEmoji ? r.jacht.emoji + ' ' : '') + r.jacht.name;
        var l = (withEmoji ? r.leid.emoji + ' ' : '') + r.leid.name;
        return r.pure ? 'een pure ' + j : j + ' met ' + l + '-trekken';
    }
    function profileExplanation(r) {
        if (r.pure) return 'Je jaagt én leidt als een ' + r.jacht.name + ': ' + lowerFirst(r.jacht.sterkte) + ' Je valkuil: ' + lowerFirst(r.jacht.blindeVlek);
        return 'Je jaagt als een ' + r.jacht.name + ': ' + lowerFirst(r.jacht.sterkte) + ' Je leidt als een ' + r.leid.name + ': ' + lowerFirst(r.leid.sterkte);
    }

    // ============================================================
    // TEXTS FOR MONDAY AND ACTIVECAMPAIGN
    // ============================================================
    function answerText(q) {
        var v = state.answers[q.id];
        if (v == null) return null;
        if (q.kind === 'statement') return v + '/5';
        if (q.kind === 'rating') return v + '/10';
        if (q.kind === 'styleGroup') {
            var groups = STYLE[q.style].groups;
            for (var i = 0; i < groups.length; i++) { if (groups[i].group === v) return groups[i].label; }
            return null;
        }
        if (q.kind === 'styleAnimal') {
            var options = STYLE[q.style].animals;
            for (var j = 0; j < options.length; j++) { if (options[j].animal === v) return options[j].label + ' (' + ANIMALS[v].name + ')'; }
            return ANIMALS[v].name;
        }
        var opt = q.options[v];
        return (typeof opt === 'string' ? opt : opt.label) + (q.suffix || '');
    }

    // Answers on the weakest level, so they stand out before a call.
    function redFlags() {
        var flags = [];
        scoredQuestions().forEach(function (q) {
            var g = gradeOf(q);
            if (q.kind === 'rating' ? g > 5 : g > 1.001) return;
            flags.push(q.flag ? q.flag.replace('{n}', state.answers[q.id]) : contextFor(q) + ': ' + answerText(q));
        });
        return flags;
    }

    function buildSummary(r) {
        var lines = [
            'Performance Score: ' + fmt(r.total) + ' (doel ' + fmt(TARGET) + ')',
            DOMAIN_ORDER.map(function (D) { return DOMAINS[D] + ' ' + fmt(r.domains[D]); }).join(' · '),
            LEVER_ORDER.map(function (L) { return LEVERS[L] + ' ' + fmt(r.levers[L]); }).join(' · '),
            'Grootste lek: ' + LEVERS[r.lek] + ' (' + r.lekLevel.name + ')' + (r.lekDomain ? ', vooral in ' + DOMAINS[r.lekDomain] : '')
        ];
        if (r.tweede) lines.push('Tweede lek: ' + LEVERS[r.tweede] + ' (' + r.tweedeLevel.name + ')');
        lines.push('Apex Predator: ' + profileLabel(r, false) + ' (jacht: ' + r.jacht.name + ', leiderschap: ' + r.leid.name + ')');
        lines.push('Actie van de week: ' + r.action.name);
        lines.push('');
        lines.push('Situatie: ' + answerText(Q.situatie));
        if (r.revenue) lines.push('Omzet: ' + r.revenue.label + (r.cost ? ' (inschatting kosten: ' + fmtEUR(r.cost.monthly) + ' per maand)' : ''));
        if (state.answers.verandering != null) lines.push('Wil vooral veranderen: ' + answerText(Q.verandering));
        if (state.answers.hoe_lang != null) lines.push('Herkent dit al: ' + answerText(Q.hoe_lang));
        if (state.answers.urgentie != null) lines.push('Urgentie: ' + state.answers.urgentie + '/10');
        var flags = redFlags();
        if (flags.length) {
            lines.push('', 'Rode vlaggen:');
            flags.forEach(function (f) { lines.push('- ' + f); });
        }
        return lines.join('\n');
    }

    function buildAnswers() {
        var lines = ['Alle antwoorden (stellingen: 1 = klopt helemaal niet, 5 = klopt helemaal)', ''];
        var n = 0;
        QUESTIONS.forEach(function (q) {
            if (!isShown(q)) return;
            n++;
            var title = titleFor(q);
            if (q.kind === 'statement' && q.low) title += ' (1 = ' + lowerFirst(q.low) + ', 5 = ' + lowerFirst(q.high) + ')';
            if (q.kind === 'rating') title += ' (1 = ' + q.low + ', 10 = ' + q.high + ')';
            lines.push(n + '. ' + contextFor(q) + ': ' + title);
            lines.push('   → ' + (answerText(q) || '(niet beantwoord)'));
        });
        return lines.join('\n');
    }

    function csrfHeaders() {
        return { 'Content-Type': 'application/json', 'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]').content, 'Accept': 'application/json' };
    }

    function submitResults() {
        if (state.submitted || !CONTACT) return;
        state.submitted = true;
        if (TEST_MODE) return;
        var r = computeResults();
        function tenths(g) { return Math.round(g * 10); }
        var payload = {
            name: CONTACT.name, email: CONTACT.email, phone: CONTACT.phone || null, lead_id: CONTACT.lead || null,
            score: round1(r.total),
            domains: { werk: round1(r.domains.werk), prive: round1(r.domains.prive), fysiek: round1(r.domains.fysiek) },
            metrics: { focus: round1(r.levers.focus), energie: round1(r.levers.energie), structuur: round1(r.levers.structuur), besluit: round1(r.levers.besluit), leiderschap: round1(r.levers.leiderschap) },
            lek: LEVERS[r.lek] + ' · niveau ' + r.lekLevel.name + (r.lekDomain ? ' · vooral in ' + DOMAINS[r.lekDomain] : ''),
            lek_zin: 'Als ' + r.lekSentence.animal.name + ': ' + r.lekSentence.text,
            tweede_lek: r.tweede ? LEVERS[r.tweede] : null,
            profiel: upperFirst(profileLabel(r, true)),
            profiel_uitleg: profileExplanation(r),
            jachtstijl: r.jacht.emoji + ' ' + r.jacht.name + ' · ' + r.jacht.archetype,
            leiderschapsstijl: r.leid.emoji + ' ' + r.leid.name + ' · ' + r.leid.archetype,
            action_name: r.action.name, action_text: r.action.text,
            revenue_label: r.revenue ? r.revenue.label : null,
            cost_monthly: r.cost ? r.cost.monthly : null, cost_yearly: r.cost ? r.cost.yearly : null,
            verandering: answerText(Q.verandering), urgentie: state.answers.urgentie || null,
            // Compact numbers for the score card picture in the results e-mail.
            card: {
                s: tenths(r.total),
                d: DOMAIN_ORDER.map(function (D) { return tenths(r.domains[D]); }),
                h: LEVER_ORDER.map(function (L) { return tenths(r.levers[L]); }),
                lk: r.lek, ld: r.lekDomain, j: r.jachtKey, o: r.leidKey
            },
            summary: buildSummary(r),
            answers_text: buildAnswers(),
            bron: window.apexLeadSource()
        };
        fetch(SUBMIT_URL, {
            method: 'POST', headers: csrfHeaders(), credentials: 'same-origin',
            // keepalive: the request finishes even if the visitor leaves right after.
            keepalive: true,
            body: JSON.stringify(payload)
        }).catch(function () {});
        // A later scan in the same visit becomes a new lead.
        CONTACT.lead = null;
        try { sessionStorage.setItem('apexScanContact', JSON.stringify(CONTACT)); } catch (e) {}
    }

    // Where a visitor is in the scan, so Monday shows where they stopped.
    var lastProgress = null;
    function sendProgress() {
        if (TEST_MODE || !CONTACT || !CONTACT.lead || state.submitted) return;
        var step = STEPS[state.stepIndex];
        if (step.kind === 'results' || step.kind === 'capture') return;
        var question = Math.max(1, questionNumber(state.stepIndex));
        var label = isQuestion(step) ? contextFor(step) : 'Tussenscherm';
        if (lastProgress === question + label) return;
        lastProgress = question + label;
        try {
            fetch(PROGRESS_URL, {
                method: 'POST', headers: csrfHeaders(), credentials: 'same-origin', keepalive: true,
                body: JSON.stringify({ lead: CONTACT.lead, email: CONTACT.email, question: question, total: totalQuestions(), label: label })
            }).catch(function () {});
        } catch (e) {}
    }
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') sendProgress(); });
    window.addEventListener('pagehide', sendProgress);

    // ============================================================
    // RENDERING
    // ============================================================
    function el(tag, attrs, html) {
        var e = document.createElement(tag);
        if (attrs) for (var k in attrs) {
            if (k === 'class') e.className = attrs[k];
            else e.setAttribute(k, attrs[k]);
        }
        if (html != null) e.innerHTML = html;
        return e;
    }
    function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function lowerFirst(s) { return s.charAt(0).toLowerCase() + s.slice(1); }
    function upperFirst(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
    // "jelle" or "jan-willem" become "Jelle" and "Jan-Willem"; the rest stays as typed.
    function capitalizeName(name) { return name.replace(/(^|[\s-])(\p{L})/gu, function (m, sep, ch) { return sep + ch.toUpperCase(); }); }
    function fmtEUR(n) { return '€' + n.toLocaleString('nl-NL'); }

    function screenShell(step, showBack, onBack) {
        var root = el('div', { class: 'scan-shell' });
        var total = totalQuestions();
        var current = isQuestion(step) ? questionNumber(state.stepIndex) : null;
        var done = current != null ? current : questionNumber(state.stepIndex);
        var prog = el('div', { class: 'scan-progress' });
        var fill = el('div', { class: 'scan-progress-fill' });
        fill.style.width = Math.min(100, Math.round((done / total) * 100)) + '%';
        prog.appendChild(fill);
        root.appendChild(prog);

        var body = el('div', { class: 'scan-body scan-ui' });
        if (current) {
            var head = el('div', { class: 'scan-head' });
            head.appendChild(el('span', { class: 'scan-context' }, esc(contextFor(step))));
            head.appendChild(el('span', { class: 'scan-qnum' }, 'VRAAG ' + current + '/' + total));
            body.appendChild(head);
            var intro = firstOfBlock(state.stepIndex) && BLOCKS[step.block] ? BLOCKS[step.block].intro : null;
            if (intro) body.appendChild(el('p', { class: 'scan-intro' }, esc(intro)));
        }
        root.appendChild(body);

        if (showBack) {
            var backWrap = el('div', { class: 'scan-back-wrap' });
            var backBtn = el('button', { type: 'button', class: 'scan-back-btn' }, '← Vorige vraag');
            backBtn.addEventListener('click', onBack);
            backWrap.appendChild(backBtn);
            root.appendChild(backWrap);
        }
        return { root: root, body: body };
    }

    function titleEl(text, small) {
        return el('h1', { class: small ? 'scan-title-sm' : 'scan-title' + (text.length > 70 ? ' long' : '') }, esc(text));
    }

    function optionButton(container, label, sub, selected, onClick) {
        var btn = el('button', { type: 'button', class: 'scan-option' + (selected ? ' selected' : '') },
            sub ? '<span class="scan-option-label">' + esc(label) + '</span><span class="scan-option-sub">' + esc(sub) + '</span>' : esc(label));
        btn.addEventListener('click', onClick);
        container.appendChild(btn);
    }

    function scaleQuestion(container, text, value, low, high, onChange) {
        var wrap = el('div', {});
        wrap.style.marginBottom = '36px';
        wrap.appendChild(el('p', { class: 'scan-scale-text' }, esc(text)));
        var row = el('div', { class: 'scan-scale-buttons' });
        [1, 2, 3, 4, 5].forEach(function (n) {
            var btn = el('button', { type: 'button', class: 'scan-scale-btn' + (value === n ? ' selected' : ''), 'aria-label': n + ' van 5' }, String(n));
            btn.addEventListener('click', function () { onChange(n); });
            row.appendChild(btn);
        });
        wrap.appendChild(row);
        wrap.appendChild(el('div', { class: 'scan-scale-labels' }, '<span>' + esc(low) + '</span><span>' + esc(high) + '</span>'));
        container.appendChild(wrap);
    }

    function ratingQuestion(container, value, low, high, onChange) {
        var grid = el('div', { class: 'scan-rating' });
        for (var n = 1; n <= 10; n++) {
            (function (n) {
                var btn = el('button', { type: 'button', class: 'scan-rating-btn' + (value === n ? ' selected' : ''), 'aria-label': n + ' van 10' }, String(n));
                btn.addEventListener('click', function () { onChange(n); });
                grid.appendChild(btn);
            })(n);
        }
        container.appendChild(grid);
        container.appendChild(el('div', { class: 'scan-scale-labels' }, '<span>1 = ' + esc(low) + '</span><span>10 = ' + esc(high) + '</span>'));
    }

    function render() {
        var app = document.getElementById('scan-app');
        app.innerHTML = '';
        if (TEST_MODE) app.appendChild(el('div', { class: 'scan-test-badge' }, 'Testmodus: er wordt niets verstuurd'));
        window.scrollTo(0, 0);
        var step = STEPS[state.stepIndex];
        var s;

        if (step.kind === 'choice') {
            s = screenShell(step, canGoBack(), goBack);
            s.body.appendChild(titleEl(titleFor(step), !!step.sub));
            if (step.sub) s.body.appendChild(el('p', { class: 'scan-sub' }, esc(step.sub)));
            step.options.forEach(function (label, i) {
                optionButton(s.body, label, null, state.answers[step.id] === i, function () { state.answers[step.id] = i; goNext(); });
            });
            app.appendChild(s.root);
            return;
        }

        if (step.kind === 'ladder') {
            s = screenShell(step, canGoBack(), goBack);
            s.body.appendChild(titleEl(titleFor(step)));
            orderFor(step.id, step.options.length, step.shuffle).forEach(function (i) {
                var o = step.options[i];
                optionButton(s.body, typeof o === 'string' ? o : o.label, typeof o === 'string' ? null : o.sub, state.answers[step.id] === i,
                    function () { state.answers[step.id] = i; goNext(); });
            });
            app.appendChild(s.root);
            return;
        }

        if (step.kind === 'statement') {
            s = screenShell(step, canGoBack(), goBack);
            scaleQuestion(s.body, step.text, state.answers[step.id], step.low || 'Klopt helemaal niet', step.high || 'Klopt helemaal',
                function (v) { state.answers[step.id] = v; goNext(); });
            app.appendChild(s.root);
            return;
        }

        if (step.kind === 'rating') {
            s = screenShell(step, canGoBack(), goBack);
            s.body.appendChild(titleEl(titleFor(step)));
            ratingQuestion(s.body, state.answers[step.id], step.low, step.high, function (v) { state.answers[step.id] = v; goNext(); });
            app.appendChild(s.root);
            return;
        }

        if (step.kind === 'styleGroup') {
            var cfg = STYLE[step.style];
            s = screenShell(step, canGoBack(), goBack);
            s.body.appendChild(titleEl(cfg.question, true));
            s.body.appendChild(el('p', { class: 'scan-sub' }, esc(cfg.sub)));
            orderFor(step.id, cfg.groups.length, true).forEach(function (i) {
                var g = cfg.groups[i];
                optionButton(s.body, g.label, null, state.answers[step.id] === g.group, function () {
                    // A different group means a different set of animals on the next screen.
                    if (state.answers[step.id] !== g.group) delete state.answers[step.style === 'jacht' ? 'jachtB' : 'leidB'];
                    state.answers[step.id] = g.group;
                    goNext();
                });
            });
            app.appendChild(s.root);
            return;
        }

        if (step.kind === 'styleAnimal') {
            var options = animalOptions(step.style);
            s = screenShell(step, canGoBack(), goBack);
            s.body.appendChild(titleEl(titleFor(step), true));
            s.body.appendChild(el('p', { class: 'scan-sub' }, esc(STYLE[step.style].sub)));
            orderFor(step.id + ':' + state.answers[step.style === 'jacht' ? 'jachtA' : 'leidA'], options.length, true).forEach(function (i) {
                var o = options[i];
                optionButton(s.body, o.label, null, state.answers[step.id] === o.animal, function () { state.answers[step.id] = o.animal; goNext(); });
            });
            app.appendChild(s.root);
            return;
        }

        if (step.kind === 'interstitial') {
            s = screenShell(step, false, null);
            var wrap = el('div', {});
            wrap.style.textAlign = 'center';
            if (step.key === 'social') {
                var left = totalQuestions() - questionNumber(state.stepIndex);
                wrap.innerHTML =
                    '<p style="font-size:13px;letter-spacing:1.5px;color:var(--scan-accent);margin-bottom:24px;font-weight:700;">14 JAAR ERVARING · 500+ MENSEN GEHOLPEN</p>' +
                    '<p style="font-size:20px;color:var(--scan-text-dim);line-height:1.6;margin-bottom:32px;">Als coach zie ik al 14 jaar hetzelfde patroon: het is zelden een kennisprobleem. Het is een systeem dat niet past bij hoe jij van nature werkt.</p>' +
                    '<p style="font-size:14px;color:var(--scan-text-dim);margin-bottom:28px;">Je bent goed op weg, nog ' + left + ' vragen.</p>';
            } else {
                wrap.innerHTML =
                    '<h2 style="font-style:italic;font-size:30px;margin-bottom:24px;">Wist je dit?</h2>' +
                    '<p style="font-size:17px;color:var(--scan-text-dim);line-height:1.7;margin-bottom:16px;">De meeste ondernemers die dit herkennen hebben geen kennisprobleem. Ze weten al wat ze moeten doen. Het probleem zit in het systeem eromheen. Zodra dat systeem past bij wie jij bent, wordt het ineens makkelijk om vol te houden.</p>' +
                    '<p style="font-size:15px;color:var(--scan-text-dim);line-height:1.7;margin-bottom:32px;">Nu je Apex Predator-profiel: hoe jij van nature jaagt en leidt.</p>';
            }
            var next = el('button', { type: 'button', class: 'scan-primary-btn' }, 'Volgende');
            next.addEventListener('click', goNext);
            wrap.appendChild(next);
            s.body.appendChild(wrap);
            app.appendChild(s.root);
            return;
        }

        if (step.kind === 'capture') {
            renderCapture(app);
            return;
        }

        if (step.kind === 'results') {
            submitResults();
            renderResults(app);
        }
    }

    function renderCapture(app) {
        var s = screenShell({ kind: 'capture' }, false, null);
        s.body.appendChild(el('h1', { class: 'scan-title-sm' }, 'Waar mogen we je uitslag naartoe sturen?'));
        s.body.appendChild(el('p', { class: 'scan-sub' }, 'Je uitslag zie je direct na de laatste vraag, en je krijgt hem ook in je mail.'));

        var form = el('form', {});
        function field(attrs) {
            var input = el('input', Object.assign({ class: 'scan-option', style: 'cursor:text;' }, attrs));
            input.style.marginBottom = '14px';
            form.appendChild(input);
            return input;
        }
        var nameInput = field({ type: 'text', placeholder: 'Voornaam', required: 'required', autocomplete: 'given-name' });
        var emailInput = field({ type: 'email', placeholder: 'E-mailadres', required: 'required', autocomplete: 'email' });
        var phoneInput = field({ type: 'tel', placeholder: 'Telefoonnummer', required: 'required', autocomplete: 'tel' });
        var errorP = el('p', { style: 'color:var(--scan-danger);font-size:13px;margin:0 0 8px;' }, '');
        form.appendChild(errorP);
        var submitBtn = el('button', { type: 'submit', class: 'scan-primary-btn' }, 'Start de scan');
        form.appendChild(submitBtn);
        form.appendChild(el('p', { style: 'font-size:12px;color:var(--scan-text-dim);text-align:center;margin-top:14px;' },
            'Gratis &middot; geen account nodig &middot; <a href="' + esc(PRIVACY_URL) + '" target="_blank" rel="noopener" style="color:inherit;">privacyreglement</a>'));

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var contact = { name: capitalizeName(nameInput.value.trim()), email: emailInput.value.trim(), phone: phoneInput.value.trim(), lead: null, at: Date.now() };
            if (!contact.name || !/^\S+@\S+\.\S+$/.test(contact.email) || contact.phone.replace(/\D/g, '').length < 8) {
                errorP.textContent = 'Vul je voornaam, een geldig e-mailadres en je telefoonnummer in.';
                return;
            }
            function proceed() {
                CONTACT = contact;
                try { sessionStorage.setItem('apexScanContact', JSON.stringify(contact)); } catch (err) {}
                goNext();
            }
            if (TEST_MODE) { proceed(); return; }
            submitBtn.disabled = true;
            submitBtn.textContent = 'Even geduld...';
            var controller = 'AbortController' in window ? new AbortController() : null;
            var timer = setTimeout(function () { if (controller) controller.abort(); }, 6000);
            fetch(START_URL, {
                method: 'POST', headers: csrfHeaders(), credentials: 'same-origin',
                body: JSON.stringify({ name: contact.name, email: contact.email, phone: contact.phone, bron: window.apexLeadSource() }),
                signal: controller ? controller.signal : undefined
            })
                .then(function (res) { return res.ok ? res.json() : {}; })
                .then(function (data) { contact.lead = data.lead || null; })
                .catch(function () {})
                .finally(function () { clearTimeout(timer); proceed(); });
        });

        s.body.appendChild(form);
        app.appendChild(s.root);
    }

    // ============================================================
    // RESULTS
    // ============================================================
    function ring(grade) {
        var wrap = el('div', { class: 'scan-ring' });
        var r = 64, C = 2 * Math.PI * r;
        var off = C * (1 - Math.max(0, Math.min(10, grade)) / 10);
        // A small marker where the 8,5 is.
        var a = TARGET / 10 * 2 * Math.PI;
        wrap.innerHTML =
            '<svg viewBox="0 0 150 150" aria-hidden="true">' +
            '<circle cx="75" cy="75" r="' + r + '" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="12"/>' +
            '<circle cx="75" cy="75" r="' + r + '" fill="none" style="stroke:' + colorFor(grade) + ';" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/>' +
            '<circle cx="' + (75 + r * Math.cos(a)).toFixed(1) + '" cy="' + (75 + r * Math.sin(a)).toFixed(1) + '" r="4" fill="#ffffff"/>' +
            '</svg>' +
            '<div class="scan-ring-value"><strong style="color:' + colorFor(grade) + ';">' + fmt(grade) + '</strong><span>van de 10</span></div>';
        return wrap;
    }
    function bandText(grade) {
        var t = round1(grade);
        if (t >= 8.5) return 'Je scoort een <strong>8,5 of hoger</strong>: daar draait de missie van Apex om. Nu gaat het erom dat het zo blijft, ook als het druk wordt.';
        if (t >= 7) return 'Een sterke basis. Het laatste stuk naar een <strong>8,5 of hoger</strong> op elk domein is vaak het lastigste.';
        if (t >= 5.5) return 'Je doet het niet slecht, maar er ligt duidelijk rendement op tafel.';
        return 'Er zit veel ruimte tussen waar je nu staat en de missie van Apex om mensen te helpen om op ieder domein van hun leven een <strong>8,5 of hoger</strong> te scoren. Dat is geen kwestie van te weinig hard werken. Je werkt waarschijnlijk te hard, voor een systeem dat niet bij je past.';
    }
    function metricRow(container, label, value) {
        var row = el('div', { class: 'scan-metric-row' });
        row.innerHTML =
            '<div class="scan-metric-top"><span>' + esc(label) + '</span><span style="font-weight:700;color:' + colorFor(value) + ';">' + fmt(value) + '</span></div>' +
            '<div class="scan-metric-bar-bg"><div class="scan-metric-bar-fill" style="width:' + Math.round(value * 10) + '%;background:' + colorFor(value) + ';"></div></div>';
        container.appendChild(row);
    }
    // Where we aim to be in 12 weeks: 60% of the remaining distance to a 10,
    // so a low grade takes a bigger step than a high one.
    function in12Weeks(now) { return Math.min(10, now + (10 - now) * 0.6); }
    function futureRow(container, label, now) {
        var row = el('div', { class: 'scan-future-row' });
        row.innerHTML = '<span>' + esc(label) + '</span>' +
            '<div class="scan-future-bar" role="img" aria-label="' + esc(label) + ': nu ' + fmt(now) + ', over 12 weken ' + fmt(in12Weeks(now)) + '">' +
            '<div class="scan-future-now" style="width:' + Math.round(now * 10) + '%;"></div>' +
            '<div class="scan-future-mark" style="left:' + Math.round(in12Weeks(now) * 10) + '%;"></div></div>';
        container.appendChild(row);
    }
    function animalCard(container, animal, heading) {
        var card = el('div', { class: 'scan-animal-card' });
        function line(label, text) { return '<p class="scan-animal-line"><strong>' + label + ':</strong> <span>' + esc(text) + '</span></p>'; }
        card.innerHTML =
            '<p class="scan-card-title" style="margin-bottom:10px;">' + esc(heading) + '</p>' +
            '<p class="scan-animal-name">' + animal.emoji + ' ' + esc(animal.name) + ' <span>— ' + esc(animal.archetype) + '</span></p>' +
            line('Sterkte', animal.sterkte) + line('Blinde vlek', animal.blindeVlek) + line('Risico onder druk', animal.risico) + line('Groeiopdracht', animal.groei);
        container.appendChild(card);
    }
    function quote(sentence) {
        return '<blockquote class="scan-quote"><span>Als ' + esc(sentence.animal.name) + '</span>' + esc(sentence.text) + '</blockquote>';
    }
    function bulletLine(container, bold, text) {
        var p = el('p', { class: 'scan-bullet' });
        p.innerHTML = '<span class="arrow">→ </span><strong>' + esc(bold) + '</strong> ' + esc(text);
        container.appendChild(p);
    }

    function renderResults(app) {
        var r = computeResults();
        var firstName = CONTACT && CONTACT.name ? capitalizeName(CONTACT.name.split(/\s+/)[0]) : '';
        var root = el('div', { class: 'scan-results scan-ui' });
        var inner = el('div', { class: 'scan-results-inner' });
        root.appendChild(inner);

        inner.appendChild(el('p', { class: 'scan-eyebrow' }, 'JE PERFORMANCE PROFIEL'));
        inner.appendChild(el('h1', { class: 'scan-h1' }, 'Hier is wat we zien' + (firstName ? ', ' + esc(firstName) : '') + '.'));

        var hero = el('div', { class: 'scan-hero' });
        hero.appendChild(ring(r.total));
        hero.appendChild(el('div', {}, '<p class="scan-hero-goal">De missie van Apex: <strong>8,5 of hoger</strong></p><p class="scan-hero-text">' + bandText(r.total) + '</p>'));
        inner.appendChild(hero);

        var domains = el('div', { class: 'scan-domains' });
        DOMAIN_ORDER.forEach(function (D) {
            var g = r.domains[D];
            domains.appendChild(el('div', { class: 'scan-domain' },
                '<div class="scan-domain-label">' + DOMAINS[D] + '</div>' +
                '<div class="scan-domain-grade" style="color:' + colorFor(g) + ';">' + fmt(g) + '</div>' +
                '<div class="scan-domain-level">' + levelFor(g).name + '</div>'));
        });
        inner.appendChild(domains);

        var levers = el('div', { class: 'scan-card' });
        levers.appendChild(el('p', { class: 'scan-card-title' }, 'JE VIJF HEFBOMEN'));
        LEVER_ORDER.forEach(function (L) { metricRow(levers, LEVERS[L], r.levers[L]); });
        levers.appendChild(el('div', { class: 'scan-legend' },
            '<span><i style="background:var(--lvl-green);"></i>8,5 of hoger</span>' +
            '<span><i style="background:var(--lvl-gold);"></i>5,5 tot 8,5</span>' +
            '<span><i style="background:var(--lvl-orange);"></i>onder 5,5</span>'));
        inner.appendChild(levers);

        var lekGrade = r.levers[r.lek];
        inner.appendChild(el('div', { class: 'scan-card accent' },
            '<p class="scan-card-title">JE GROOTSTE LEK</p>' +
            '<p class="scan-lek-name" style="color:' + colorFor(lekGrade) + ';">' + esc(LEVERS[r.lek]) + ' <span>' + fmt(lekGrade) + '</span></p>' +
            '<div class="scan-chips"><span class="scan-chip">Niveau: ' + r.lekLevel.name + '</span>' +
            (r.lekDomain ? '<span class="scan-chip">Vooral in ' + DOMAINS[r.lekDomain] + '</span>' : '') + '</div>' +
            '<p class="scan-text">' + esc(r.lekLevel.text) + '</p>' +
            (r.lekLevel.min >= 7 ? '<p class="scan-text">Je doet het al goed. Gaat het ergens schuren, dan hier:</p>' : '') +
            quote(r.lekSentence) +
            '<p class="scan-card-title" style="margin-top:24px;">DE VOLGENDE STAP</p>' +
            '<p class="scan-text" style="margin:0;">' + esc(NEXT_STEPS[r.lek]) + '</p>'));

        inner.appendChild(el('div', { class: 'scan-card' },
            '<p class="scan-card-title">ÉÉN ACTIE VOOR DEZE WEEK</p>' +
            '<p style="font-size:22px;font-weight:700;margin:0 0 10px;">' + esc(r.action.name) + '</p>' +
            '<p class="scan-text" style="margin:0;">' + esc(r.action.text) + '</p>'));

        if (r.cost) {
            inner.appendChild(el('div', { class: 'scan-card' },
                '<p class="scan-card-title">WAT DIT JE NAAR SCHATTING KOST</p>' +
                '<p style="font-size:40px;font-weight:700;color:var(--lvl-orange);margin:0 0 12px;">' + fmtEUR(r.cost.monthly) + ' <span style="font-size:18px;font-weight:400;color:var(--scan-text-dim);">/maand</span></p>' +
                '<p class="scan-text" style="margin:0;">Op dit tempo laat je dit jaar naar schatting <strong>' + fmtEUR(r.cost.yearly) + '</strong> liggen. Niet omdat je geen goede ondernemer bent, maar omdat je systeem niet meer meekan met wat je erdoorheen probeert te jagen.</p>' +
                '<p class="scan-note">Inschatting op basis van je omzet en je cijfers, geen exacte berekening.</p>'));
        }

        var future = el('div', { class: 'scan-card' });
        future.appendChild(el('p', { class: 'scan-card-title' }, 'WAAR WE IN 12 WEKEN NAARTOE WERKEN'));
        LEVER_ORDER.forEach(function (L) { futureRow(future, LEVERS[L], r.levers[L]); });
        future.appendChild(el('div', { class: 'scan-legend' },
            '<span><i style="background:var(--lvl-gold);"></i>Nu</span>' +
            '<span><i style="background:var(--lvl-green);"></i>Over 12 weken</span>'));
        inner.appendChild(future);

        inner.appendChild(el('div', { class: 'scan-anchor' }, '<p>— JE APEX PREDATOR-PROFIEL —</p>'));
        inner.appendChild(el('p', { class: 'scan-italic-sub' }, 'Naast je cijfers laat de scan zien hoe jij van nature jaagt en leidt. Dit verandert niet door coaching — dit ben jij. De vraag is of je de schaduwkant van je talent al herkent.'));
        inner.appendChild(el('p', { class: 'scan-combo' }, r.pure
            ? 'Een pure ' + r.jacht.emoji + ' <strong>' + esc(r.jacht.name) + '</strong>'

        animalCard(inner, r.jacht, r.pure ? 'JACHTSTIJL ÉN LEIDERSCHAPSSTIJL' : 'JACHTSTIJL: HOE JIJ RESULTAAT BEHAALT');
        if (!r.pure) animalCard(inner, r.leid, 'LEIDERSCHAPSSTIJL: HOE JIJ ANDEREN MEEKRIJGT');

                quote(r.tweedeSentence) +
                '<p class="scan-text" style="margin:0;">Daar kijken we in de Doorbraak Sessie samen naar.</p>'));

        // Jeroen's own track record, as on the homepage: no client results from elsewhere.
        function stat(number, label) { return '<div class="scan-stat"><strong>' + number + '</strong><span>' + label + '</span></div>'; }
        inner.appendChild(el('div', { class: 'scan-card' },
            '<p class="scan-card-title">APEX IN CIJFERS</p>' +
            '<div class="scan-stats-grid">' +
            stat('14 jaar', 'ervaring als coach') +
            stat('500+', 'mensen geholpen') +
            stat('21×', '5 sterren op Google') +
            stat('€150K+', 'geïnvesteerd in eigen ontwikkeling') +
            '</div>'));

        var ctaWrap = el('div', {});
        ctaWrap.style.marginTop = '40px';
        ctaWrap.innerHTML =
            '<h2 class="scan-cta-h2">Oké, je hebt je diagnose. Maar wat ga je ermee doen?</h2>' +
            '<p class="scan-cta-p">Voor een ' + esc(r.jacht.name) + ' met ' + esc(LEVERS[r.lek].toLowerCase()) + ' als grootste lek is de oplossing bijna nooit "meer discipline". Het is een systeem dat past bij hoe jij van nature jaagt en leidt. Dat heb je waarschijnlijk nog niet gehad.</p>';
        inner.appendChild(ctaWrap);

        var offerCard = el('div', { class: 'scan-card' });
        offerCard.innerHTML =
            '<p class="scan-offer-title">Doorbraak Sessie <span>(60 min)</span></p>' +
            '<p class="scan-offer-p">1-op-1 met mij. We kijken samen wat voor jouw profiel het verschil maakt, en je loopt weg met drie concrete acties. Ook als we daarna niks meer met elkaar doen.</p>';
        bulletLine(offerCard, 'Je grootste lek op tafel.', 'Wat er achter je ' + LEVERS[r.lek].toLowerCase() + ' zit, en hoe je dat aanpakt op een manier die bij jouw profiel past.');
        bulletLine(offerCard, 'Drie acties voor deze week.', 'Specifiek voor jouw profiel, jouw werk en jouw situatie.');
        bulletLine(offerCard, 'Een eerlijke check.', 'Of een traject met Apex logisch is voor jou. Ik werk niet met iedereen.');
        ctaWrap.appendChild(offerCard);

        ctaWrap.appendChild(el('a', { class: 'scan-primary-link', href: CTA_URL }, 'Plan je gratis Doorbraak Sessie'));
        if (SCARCITY) {
            ctaWrap.appendChild(el('a', { class: 'scan-scarcity', href: GRATIS_URL },
                'Of kom naar de gratis Performance Sessie — nog ' + SCARCITY.remaining + ' van de ' + SCARCITY.capacity + ' plekken, inschrijven t/m ' + SCARCITY.deadline));
        }

        app.appendChild(root);
    }

    render();
})();
</script>
</body>
</html>
